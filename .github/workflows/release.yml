# Publica una versión de Acustica3D cuando cambia "version" en acustica3d/package.json en main
# (o a mano desde la pestaña Actions). Si ya existe la release de esa versión, no hace nada.
#   1. version   lee la versión y comprueba si ya está publicada
#   2. exe       compila Acustica3D.exe en Windows (MinGW de MSYS2: no depende de los servidores de
#                paquetes de Ubuntu, que a veces se quedan colgados)
#   3. publicar  pruebas, compilación web, paquetes (.zip para descargar a mano y .pack para el
#                actualizador automático) y release vX.Y.Z
name: Publicar versión de Acustica3D

on:
  push:
    branches: [main]
    paths: ['acustica3d/package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      nueva: ${{ steps.ver.outputs.nueva }}
    steps:
      - uses: actions/checkout@v4
      - name: Versión de package.json
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./acustica3d/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "La release v$VERSION ya existe: nada que publicar."
            echo "nueva=no" >> "$GITHUB_OUTPUT"
          else
            echo "nueva=si" >> "$GITHUB_OUTPUT"
          fi

  exe:
    needs: version
    if: needs.version.outputs.nueva == 'si'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Acustica3D.exe
        run: >
          gcc -O2 -Wall -mwindows -static -DAPP_VERSION="\"${{ needs.version.outputs.version }}\""
          -o acustica3d/launcher/Acustica3D.exe acustica3d/launcher/acustica3d.c -lws2_32 -lshell32 -ladvapi32 -lwinhttp
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: acustica3d/launcher/Acustica3D.exe
          if-no-files-found: error

  publicar:
    needs: [version, exe]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: acustica3d
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: acustica3d/package-lock.json
      - name: Pruebas y compilación web
        run: |
          npm ci
          npx svelte-kit sync
          npx svelte-check --threshold error
          npx vitest run
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: acustica3d/launcher
      - name: Paquetes
        run: node scripts/package.mjs "$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Acustica3D ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            acustica3d/dist/Acustica3D_win64.zip
            acustica3d/dist/Acustica3D_win64.pack
            acustica3d/dist/Sala3D_win64.pack
